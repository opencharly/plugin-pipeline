plugin-pipeline:
    candy:
        description: |-
            The workflow front-end — domain-neutral: resolve + validate a declared
            kind:pipeline entity (spec.Pipeline, `steps:`), lower it with
            sdk/workflowkit to the (workflow.lobster, charly.yml) pair, and dispatch
            the pair to the `workflow` provider class as workflow-run. Also the bare
            agent runtime (the standalone 'charly pipeline agent'), deterministic
            probe verbs, template/frontmatter rendering, and skills by @github candy
            refs. Every stage kind is ALSO a reachable verb
            (verb:agent/probe/ade/generate/emit/media/gate), so a stage body can be
            driven as a `<word>: <input>` step from any plan. Execution/control flow
            belongs to the `workflow` ENGINE, not this plugin.
        plugin:
            providers:
                - command:pipeline
                - verb:pipeline
                - kind:pipeline
                - verb:agent
                - verb:probe
                - verb:ade
                - verb:generate
                - verb:emit
                - verb:media
                - verb:gate
            source: github.com/opencharly/plugin-pipeline/candy/plugin-pipeline
        plan:
            - check: the pipeline-skill skill entity is present in this candy's manifest (fails if the entity is removed)
              id: pipeline-skill-present
              context:
                - build
              command: "grep -q '^pipeline-skill:' charly.yml"
            - check: the pipeline module ships (go.mod + the front-end + generated params)
              id: plugin-pipeline-module-present
              context: [build]
              command: "test -f go.mod && test -f cli.go && test -f refs.go && test -f params/cue_types_gen.go"
            - check: the committed params projection matches this candy's schema (fails if the projection drifts from its source)
              id: params-projection-current
              context: [build]
              command: "${CHARLY_BIN} candy params plugin-pipeline --check"

pipeline-skill:
    skill:
        name: pipeline
        family: pipeline
        owner: plugin-pipeline
        description: |-
            The `charly pipeline` workflow front-end — resolve/validate/lower a declared
            kind:pipeline entity and dispatch it to the workflow engine, the bare agent
            runtime, deterministic probe verbs, template rendering.
        triggers:
            - "`charly pipeline` / agent workflow engine / kind:pipeline / pipeline run"
        content: |
            # charly pipeline — the workflow front-end

            `charly pipeline` is the domain-neutral workflow front-end. Served by
            `candy/plugin-pipeline` (`command:pipeline`, out-of-process over gRPC).

            ## What it provides

            - the bare agent runtime (the standalone `charly pipeline agent`);
            - the run leg — `charly pipeline run <entity>`: resolve the authored
              `kind: pipeline` entity, validate it with `sdk/workflowkit.ValidatePipeline`,
              lower it with `sdk/workflowkit.Lower` to `workflow.lobster` + a generated
              `charly.yml`, and dispatch the pair to the `workflow` provider class as
              `workflow-run` (the workflow ENGINE owns execution, control flow, redo, and
              iteration);
            - deterministic probe verbs;
            - template/frontmatter rendering;
            - the seven stage kinds as ordinary reachable verbs
              (`verb:agent/probe/ade/generate/emit/media/gate`);
            - skills by `@github` candy refs.

            Every workflow is a DECLARED pipeline (`kind:pipeline` entity: `spec.Pipeline`
            with `steps:`), so the engine is config-driven rather than code-driven.

            ## When to use it

            To run or author a `kind:pipeline` entity, or to build an agent workflow that joins
            the runtime through configuration (e.g. the `charly review --plan` executor).

            ## Cross-References

            - `/charly-internals:plugin` — the plugin/provider model.
            - `/charly-internals:go` — `kind:` schema authoring (SDD).
