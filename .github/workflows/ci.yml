name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: gofmt/vet/test
        working-directory: candy/plugin-pipeline
        run: |
          gofmt -l . | grep -v '^$' && exit 1 || true
          go vet ./...
          go test ./...
      # The committed params are regenerated IN PROCESS by the canonical pipeline
      # (spec/schemaparams.Generate, the same function `charly candy params` calls).
      # The former `cue exp gengotypes` step is gone: this schema imports the contract
      # module, which the `cue` CLI cannot resolve (it reaches modules only through an
      # OCI registry), so a CLI cat+gengotypes job would be red on every push while
      # proving nothing about the file that ships.
      - name: committed params reproduce from the schema (in-process)
        working-directory: candy/plugin-pipeline
        run: go test -run TestGeneratedParamsAreCurrentAndReproducible -v .
